<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ bot_name }} - Education Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">🎓</div>
            <div>
                <h1>{{ bot_name }}</h1>
                <p>Your simple education assistant</p>
            </div>
        </header>

        <main id="chat-box" class="chat-box">
            <div class="message bot">
                <span class="avatar">🤖</span>
                <div class="bubble">
                    Hi! I'm {{ bot_name }}. Ask me about Mathematics, Python,
                    study tips, or exam preparation.
                </div>
            </div>
        </main>

        <div class="suggestions">
            <button onclick="sendSuggestion('Give me study tips')">Study Tips</button>
            <button onclick="sendSuggestion('Help me with Python')">Python</button>
            <button onclick="sendSuggestion('Help with Mathematics')">Mathematics</button>
            <button onclick="sendSuggestion('Give me exam preparation tips')">Exam Tips</button>
        </div>

        <form id="chat-form">
            <input
                id="message-input"
                type="text"
                placeholder="Type your education question..."
                autocomplete="off"
                required
            >
            <button type="submit">Send</button>
        </form>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
